[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=68"]

[dependency-groups]
dev = [
  "deptry",
  "pytest>=9.1.1"
]

[project]
authors = [
  { name = "Bruno Caneco", email = "bruno@dmpstats.com" }
]
# PEP 621 project metadata
# See https://www.python.org/dev/peps/pep-0621/
dependencies = [
  "pillow>=10.2.0,<11.0.0",
  "opencv-python-headless>=4.8.1.78,<5.0.0",
  "tqdm>=4.66.2,<5.0.0",
  "requests>=2.31.0,<3.0.0",
  "matplotlib>=3.8.0,<4.0.0",
  "numpy>=1.24.3,<2.0.0",
  "pandas>=2.2.1,<3.0.0",
  "lxml>=5.0.0,<6.0.0",
  "tensorflow>=2.16.0,<3.0.0",
  "absl-py>=1.0.0,<2.0.0"
]
description = ""
license = "MIT"
name = "sscd"
readme = "README.md"
requires-python = ">=3.10,<3.13"
version = "0.1.0"

[project.optional-dependencies]
gui = [
  "streamlit>=1.64.0,<2.0.0",
  "streamlit-image-coordinates>=0.4.1"
]

[tool.deptry]
# pascalvoc.py is the vendored metrics library's own stand-alone CLI (not used
# by SSCD); it imports its modules via a sys.path hack deptry cannot follow
extend_exclude = ["obj_det_metrics/pascalvoc.py"]
known_first_party = ["sscd_libs"]

[tool.pytest.ini_options]
markers = [
  "slow: runs the detectors (needs the trained weights; skipped without them)"
]
testpaths = ["tests"]

[tool.ruff]
# vendored third-party code (yolov3-tf2, Object-Detection-Metrics) and training tools are
# kept as written upstream
extend-exclude = ["obj_det_metrics", "tools", "yolov3_tf2"]
fix = true

[tool.ruff.lint]
# Bug-catching rules only. The code is deliberately not restyled (no ruff-format, no
# style/modernisation rules) so this fork stays easy to merge with upstream NINAnor/sscd.
select = ["B", "E9", "F", "S", "W6"]

[tool.ruff.lint.per-file-ignores]
# asserts are how pytest tests check things; tests start processes on purpose
"tests/*" = ["S101", "S603"]

[tool.setuptools]
packages = ["sscd_libs"]
